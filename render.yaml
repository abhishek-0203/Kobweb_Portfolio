# Render Blueprint specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kobweb-portfolio
    runtime: static
    buildCommand: ./build.sh
    staticPublishPath: site/.kobweb/site
    pullRequestPreviewsEnabled: true
    envVars:
      - key: GRADLE_OPTS
        value: "-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # Fallback for client-side routing (SPA behavior)
      - type: rewrite
        source: /*
        destination: /index.html
