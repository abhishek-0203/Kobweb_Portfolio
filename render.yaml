# Render Blueprint specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: abhishek-portfolio
    runtime: static
    buildCommand: ./build.sh
    staticPublishPath: ./site/.kobweb/site
    pullRequestPreviewsEnabled: true
    envVars:
      - key: GRADLE_OPTS
        value: "-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
    headers:
      - path: /system/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /resources/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # Serve index.html at root from system folder
      - type: rewrite
        source: /
        destination: /system/index.html
      # Serve pre-rendered pages
      - type: rewrite
        source: /skill
        destination: /pages/skill.html
      - type: rewrite
        source: /project
        destination: /pages/project.html
      - type: rewrite
        source: /experiences
        destination: /pages/experiences.html
      - type: rewrite
        source: /cover-letter
        destination: /pages/cover-letter.html
      - type: rewrite
        source: /about
        destination: /pages/about.html
      - type: rewrite
        source: /aboutme
        destination: /pages/aboutme.html
      # Fallback for SPA routing
      - type: rewrite
        source: /*
        destination: /system/index.html
